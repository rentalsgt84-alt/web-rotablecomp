<!-- ================= MODAL EDIT (BARU) ================= -->
<div id="editModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl shadow-2xl border border-white/50 w-full max-w-md">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-blue-600"></i> Edit Komponen
            </h3>
            <button onclick="closeEditModal()" class="text-slate-500 hover:text-slate-800">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <form id="editForm" class="space-y-4">
            <input type="hidden" id="editIndex">

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Part Number</label>
                <input type="text" id="editPartName" disabled class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-slate-100 font-medium text-slate-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Quantity (QTY)</label>
                <input type="number" id="editQty" min="1" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-bold">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Component Status</label>
                <select id="editStatus" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-semibold">
                    <option value="Ready For Use">Ready For Use (RFU)</option>
                    <option value="Damage Core">Damage Core (DCR)</option>
                    <option value="Under Repair">Under Repair (WIP)</option>
                    <option value="In Use">In Use</option>
                    <option value="Scrap / Discarded">Scrap / Discarded</option>
                </select>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-xs rounded-lg transition-colors">
                    Batal
                </button>
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition-colors shadow-md">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // ================= KONFIGURASI LOGIN & ROLE =================
    const ACCOUNTS = {
        "admin": { password: "sangatta123", role: "admin" },
        "viewer": { password: "viewersangatta", role: "viewer" }
    };

    const loginSection = document.getElementById('loginSection');
    const mainContent = document.getElementById('mainContent');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    const formSection = document.getElementById('formSection');
    const tableSection = document.getElementById('tableSection');
    const thAction = document.getElementById('thAction');
    const userRoleBadge = document.getElementById('userRoleBadge');

    function checkSession() {
        const currentRole = sessionStorage.getItem('userRole');

        if (currentRole) {
            loginSection.classList.add('hidden');
            mainContent.classList.remove('hidden');

            if (currentRole === 'admin') {
                formSection.classList.remove('hidden');
                thAction.classList.remove('hidden');
                tableSection.classList.remove('lg:col-span-3');
                tableSection.classList.add('lg:col-span-2');

                userRoleBadge.innerText = 'Admin (Edit Mode)';
                userRoleBadge.className = 'text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-emerald-700 text-white inline-block shadow-sm';
            } else if (currentRole === 'viewer') {
                formSection.classList.add('hidden');
                thAction.classList.add('hidden');
                tableSection.classList.remove('lg:col-span-2');
                tableSection.classList.add('lg:col-span-3');

                userRoleBadge.innerText = 'Viewer (Read-Only)';
                userRoleBadge.className = 'text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-amber-600 text-white inline-block shadow-sm';
            }

            renderTable();
        } else {
            loginSection.classList.remove('hidden');
            mainContent.classList.add('hidden');
        }
    }

    loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const userInput = document.getElementById('loginUsername').value.trim();
        const passInput = document.getElementById('loginPassword').value.trim();

        if (ACCOUNTS[userInput] && ACCOUNTS[userInput].password === passInput) {
            sessionStorage.setItem('userRole', ACCOUNTS[userInput].role);
            loginError.classList.add('hidden');
            loginForm.reset();
            checkSession();
        } else {
            loginError.classList.remove('hidden');
        }
    });

    function logout() {
        sessionStorage.removeItem('userRole');
        checkSession();
    }

    // ================= SISTEM PENCATATAN DATA =================
    let inventoryData = [];
    try {
        inventoryData = JSON.parse(localStorage.getItem('inventoryData')) || [];
    } catch (e) {
        inventoryData = [];
    }

    const form = document.getElementById('itemForm');
    const logTable = document.getElementById('logTable');

    function renderTable() {
        logTable.innerHTML = '';
        let totalMasuk = 0;
        const currentRole = sessionStorage.getItem('userRole');
        const searchKeyword = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

        inventoryData.forEach(item => {
            totalMasuk += (item.qty || 1);
        });

        const filteredData = inventoryData.filter(item =>
            (item.desc || '').toLowerCase().includes(searchKeyword) ||
            (item.name || '').toLowerCase().includes(searchKeyword)
        );

        if (filteredData.length === 0) {
            const colSpanCount = currentRole === 'admin' ? 6 : 5;
            const emptyMessage = searchKeyword
                ? `Tidak ditemukan data yang cocok dengan "${searchKeyword}".`
                : 'Belum ada transaksi tercatat.';

            logTable.innerHTML = `
                <tr>
                    <td colspan="${colSpanCount}" class="py-6 text-center text-slate-900 italic font-bold">${emptyMessage}</td>
                </tr>
            `;
        } else {
            filteredData.forEach((item) => {
                const originalIndex = inventoryData.indexOf(item);

                const actionTd = currentRole === 'admin' ? `
                    <td class="py-3 px-3 text-center flex items-center justify-center gap-2">
                        <button onclick="openEditModal(${originalIndex})" class="text-blue-600 hover:text-blue-800 transition-colors p-1" title="Edit QTY & Status">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteItem(${originalIndex})" class="text-rose-600 hover:text-rose-800 transition-colors p-1" title="Hapus Data">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                ` : '';

                const row = document.createElement('tr');
                row.className = 'hover:bg-white/30 transition-colors';
                row.innerHTML = `
                    <td class="py-3 px-3 font-extrabold text-slate-900">${item.name || '-'}</td>
                    <td class="py-3 px-3 text-xs font-bold text-slate-900">${item.desc || '-'}</td>
                    <td class="py-3 px-3 font-extrabold text-center text-slate-900">${item.qty || 1}</td>
                    <td class="py-3 px-3 font-extrabold text-slate-900">${item.unitModel || '-'}</td>
                    <td class="py-3 px-3 text-xs font-bold text-slate-900">${item.status || '-'}</td>
                    ${actionTd}
                `;
                logTable.appendChild(row);
            });
        }

        document.getElementById('statTotal').innerText = totalMasuk;
        document.getElementById('statMasuk').innerText = totalMasuk;
        document.getElementById('statKeluar').innerText = 0;

        localStorage.setItem('inventoryData', JSON.stringify(inventoryData));
    }

    // ================= FUNGSI EDIT DATA (BARU) =================
    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');

    function openEditModal(index) {
        const item = inventoryData[index];
        if (!item) return;

        document.getElementById('editIndex').value = index;
        document.getElementById('editPartName').value = item.name || '-';
        document.getElementById('editQty').value = item.qty || 1;
        document.getElementById('editStatus').value = item.status || 'Ready For Use';

        editModal.classList.remove('hidden');
    }

    function closeEditModal() {
        editModal.classList.add('hidden');
    }

    editForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const index = document.getElementById('editIndex').value;
        const newQty = parseInt(document.getElementById('editQty').value, 10);
        const newStatus = document.getElementById('editStatus').value;

        if (index !== "" && inventoryData[index]) {
            inventoryData[index].qty = newQty;
            inventoryData[index].status = newStatus;

            closeEditModal();
            renderTable();
        }
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const name = document.getElementById('itemName').value.trim();
        const desc = document.getElementById('itemDesc').value.trim();
        const unitModel = document.getElementById('itemUnitModel').value;
        const status = document.getElementById('itemStatus').value;
        const type = document.getElementById('itemType').value;

        const existingIndex = inventoryData.findIndex(item =>
            (item.name || '').toLowerCase() === name.toLowerCase() &&
            (item.desc || '').toLowerCase() === desc.toLowerCase() &&
            (item.unitModel || '').toLowerCase() === unitModel.toLowerCase() &&
            (item.status || '').toLowerCase() === status.toLowerCase()
        );

        if (type === 'Masuk') {
            if (existingIndex !== -1) {
                inventoryData[existingIndex].qty = (inventoryData[existingIndex].qty || 1) + 1;
            } else {
                inventoryData.unshift({ name, desc, unitModel, status, qty: 1 });
            }
        } else if (type === 'Keluar') {
            if (existingIndex !== -1) {
                inventoryData[existingIndex].qty -= 1;
                if (inventoryData[existingIndex].qty <= 0) {
                    inventoryData.splice(existingIndex, 1);
                }
            } else {
                alert('Data komponen tidak ditemukan di stok!');
                return;
            }
        }

        form.reset();
        renderTable();
    });

    function deleteItem(index) {
        if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
            inventoryData.splice(index, 1);
            renderTable();
        }
    }

    checkSession();
</script>
