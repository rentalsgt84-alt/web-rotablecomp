<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotable Component Rental Sangatta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased p-4 md:p-8 min-h-screen bg-cover bg-center bg-no-repeat bg-fixed relative" style="background-image: url('bg.jpg');">

    <!-- Lapisan Gelap Transparan -->
    <div class="fixed inset-0 bg-black/40 -z-10"></div>

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white/40 backdrop-blur-md p-6 rounded-xl shadow-lg border border-white/30 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-lg bg-white/80 border border-slate-200 flex items-center justify-center overflow-hidden flex-shrink-0 shadow-sm">
                    <img src="logo.png" alt="Logo" class="w-full h-full object-contain p-1" onerror="this.onerror=null; this.src='https://via.placeholder.com/60?text=LOGO';">
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">Rotable Component Rental Sangatta</h1>
                    <p class="text-sm text-slate-700 font-medium">Sistem Pencatatan Keluar Masuk Barang</p>
                </div>
            </div>
        </header>

        <!-- Kartu Statistik -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white/40 backdrop-blur-md p-5 rounded-xl shadow-lg border border-white/30 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Total Rotable</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-900">0</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-blue-500/20 text-blue-700 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-receipt"></i>
                </div>
            </div>
            
            <div class="bg-white/40 backdrop-blur-md p-5 rounded-xl shadow-lg border border-white/30 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Total Barang Masuk</p>
                    <p id="statMasuk" class="text-2xl font-bold text-emerald-700">0</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-emerald-500/20 text-emerald-700 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-arrow-down-long"></i>
                </div>
            </div>

            <div class="bg-white/40 backdrop-blur-md p-5 rounded-xl shadow-lg border border-white/30 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Total Barang Keluar</p>
                    <p id="statKeluar" class="text-2xl font-bold text-rose-700">0</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-rose-500/20 text-rose-700 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-arrow-up-long"></i>
                </div>
            </div>
        </section>

        <!-- Main Content -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Form Input -->
            <div class="bg-white/40 backdrop-blur-md p-6 rounded-xl shadow-lg border border-white/30 h-fit">
                <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-square-plus text-blue-600"></i> Form Pencatatan
                </h2>
                <form id="itemForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-800 mb-1">Nama Barang</label>
                        <input type="text" id="itemName" placeholder="Masukkan nama barang" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white/70">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-800 mb-1">Jumlah</label>
                        <input type="number" id="itemQty" placeholder="0" min="1" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white/70">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-800 mb-1">Jenis Transaksi</label>
                        <select id="itemType" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white/70">
                            <option value="Masuk">Barang Masuk</option>
                            <option value="Keluar">Barang Keluar</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition duration-150 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i> Simpan Transaksi
                    </button>
                </form>
            </div>

            <!-- Tabel Riwayat -->
            <div class="lg:col-span-2 bg-white/40 backdrop-blur-md p-6 rounded-xl shadow-lg border border-white/30">
                <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-600"></i> Riwayat Transaksi
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-800">
                        <thead class="bg-white/40 text-xs uppercase text-slate-700 border-b border-slate-300/50">
                            <tr>
                                <th class="py-3 px-4 font-semibold">Waktu</th>
                                <th class="py-3 px-4 font-semibold">Nama Barang</th>
                                <th class="py-3 px-4 font-semibold">Jenis</th>
                                <th class="py-3 px-4 font-semibold">Jumlah</th>
                                <th class="py-3 px-4 font-semibold text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="logTable" class="divide-y divide-slate-300/40">
                            <!-- Data dimasukkan via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        let inventoryData = JSON.parse(localStorage.getItem('inventoryData')) || [];

        const form = document.getElementById('itemForm');
        const logTable = document.getElementById('logTable');

        function renderTable() {
            logTable.innerHTML = '';
            let totalMasuk = 0;
            let totalKeluar = 0;

            if (inventoryData.length === 0) {
                logTable.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-6 text-center text-slate-700 italic font-medium">Belum ada transaksi tercatat.</td>
                    </tr>
                `;
            } else {
                inventoryData.forEach((item, index) => {
                    const qtyNum = parseInt(item.qty, 10) || 0;
                    if (item.type === 'Masuk') totalMasuk += qtyNum;
                    if (item.type === 'Keluar') totalKeluar += qtyNum;

                    const isMasuk = item.type === 'Masuk';
                    const badgeStyle = isMasuk 
                        ? 'bg-emerald-100/90 text-emerald-800 border-emerald-300' 
                        : 'bg-rose-100/90 text-rose-800 border-rose-300';
                    const iconStyle = isMasuk ? 'fa-arrow-down' : 'fa-arrow-up';

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-white/30 transition-colors';
                    row.innerHTML = `
                        <td class="py-3 px-4 text-xs font-medium text-slate-700">${item.date || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${item.name || '-'}</td>
                        <td class="py-3 px-4">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeStyle}">
                                <i class="fa-solid ${iconStyle} text-[10px]"></i> ${item.type || '-'}
                            </span>
                        </td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${qtyNum}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="deleteItem(${index})" class="text-slate-500 hover:text-rose-600 transition-colors p-1" title="Hapus Data">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    logTable.appendChild(row);
                });
            }

            document.getElementById('statTotal').innerText = inventoryData.length;
            document.getElementById('statMasuk').innerText = totalMasuk;
            document.getElementById('statKeluar').innerText = totalKeluar;

            localStorage.setItem('inventoryData', JSON.stringify(inventoryData));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('itemName').value;
            const qty = document.getElementById('itemQty').value;
            const type = document.getElementById('itemType').value;
            
            const now = new Date();
            const date = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + 
                         now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            inventoryData.unshift({ name, qty, type, date });

            form.reset();
            renderTable();
        });

        function deleteItem(index) {
            inventoryData.splice(index, 1);
            renderTable();
        }

        renderTable();
    </script>
</body>
</html>
